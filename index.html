<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML5 标签手册 · 全标签速查</title>
<meta name="description" content="HTML5 全标签手册：按章节速查所有 HTML 标签，点击标签查看完整属性、全局属性与示例代码，支持全文搜索。">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='12'%20fill='%231F2328'/%3E%3Ctext%20x='32'%20y='45'%20font-size='34'%20text-anchor='middle'%20fill='%23E0574C'%20font-family='monospace'%3E%26lt;/%26gt;%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* ===== 设计令牌 ===== */
:root{
  --paper:#F7F4EE;
  --surface:#FFFFFF;
  --ink:#24292F;
  --ink-2:#5C6470;
  --line:#E6E0D3;
  --line-strong:#D8D0BF;
  --tag:#C9372B;        /* HTML 标签红 */
  --tag-soft:#F9EAE6;
  --attr:#1E6FB9;       /* 属性蓝 */
  --str:#5F8F4E;        /* 字符串绿 */
  --cmt:#9AA0A6;        /* 注释灰 */
  --amber:#B45309;
  --amber-soft:#FCEBD7;
  --green:#15803D;
  --green-soft:#E4F2E8;
  --shadow:0 10px 30px rgba(36,41,47,.08);
  --radius:12px;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,'Courier New',monospace;
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans);
  color:var(--ink);
  background-color:var(--paper);
  background-image:
    linear-gradient(rgba(36,41,47,.028) 1px, transparent 1px),
    linear-gradient(90deg, rgba(36,41,47,.028) 1px, transparent 1px);
  background-size:26px 26px;
  line-height:1.65;
  font-size:15px;
  -webkit-font-smoothing:antialiased;
}
body.lock{overflow:hidden}
a{color:var(--attr);text-decoration:none}
code,pre,.mono{font-family:var(--mono)}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}

/* ===== 顶栏 ===== */
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(247,244,238,.92);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{display:flex;align-items:center;gap:12px;height:52px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;color:var(--ink)}
.brand .bracket{
  width:30px;height:30px;border-radius:8px;background:#1F2328;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-weight:700;font-size:15px;color:#E0574C;flex:none;
}
.topbar .stat{display:none;gap:6px;margin-left:auto}
.topbar .stat b{font-family:var(--mono);color:var(--tag)}
@media(min-width:768px){.topbar .stat{display:flex}}

/* ===== Hero ===== */
.hero{padding:44px 0 30px}
.hero-tag{
  display:inline-flex;align-items:center;gap:7px;
  font-size:13px;color:var(--amber);background:var(--amber-soft);
  padding:4px 11px;border-radius:999px;font-weight:500;
}
.hero h1{
  font-size:clamp(30px,6vw,48px);font-weight:900;letter-spacing:-.5px;
  margin:14px 0 8px;line-height:1.2;
}
.hero h1 em{font-style:normal;color:var(--tag)}
.hero .sub{color:var(--ink-2);font-size:15px;max-width:640px}
.hero-grid{display:grid;gap:18px;margin-top:26px}
.typer{
  background:#1F2328;border-radius:var(--radius);box-shadow:var(--shadow);
  overflow:hidden;
}
.typer-head{
  display:flex;align-items:center;gap:8px;padding:11px 14px;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.typer-head i{width:11px;height:11px;border-radius:50%;display:block}
.typer-head i:nth-child(1){background:#FF5F57}.typer-head i:nth-child(2){background:#FEBC2E}.typer-head i:nth-child(3){background:#28C840}
.typer-head span{color:rgba(255,255,255,.45);font-family:var(--mono);font-size:12px;margin-left:6px}
.typer-body{padding:20px 22px;min-height:96px}
.typer-body .line{font-family:var(--mono);font-size:clamp(13px,3vw,16px);white-space:pre-wrap;word-break:break-all}
.typer-body .t{color:#E0574C}
.typer-body .at{color:#7EB8E8}
.typer-body .s{color:#A3D29A}
.typer-body .c{color:#8B949E}
.typer-body .cur{display:inline-block;width:2px;height:1.2em;background:#E0574C;vertical-align:text-bottom;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;box-shadow:0 2px 8px rgba(36,41,47,.04);
}
.stat-card b{display:block;font-size:26px;font-weight:900;font-family:var(--mono);line-height:1.2}
.stat-card b.red{color:var(--tag)}.stat-card b.blue{color:var(--attr)}.stat-card b.green{color:var(--green)}.stat-card b.amber{color:var(--amber)}
.stat-card span{font-size:13px;color:var(--ink-2)}
@media(min-width:768px){
  .hero-grid{grid-template-columns:1.15fr .85fr;align-items:stretch}
  .stats{grid-template-columns:repeat(2,1fr);align-content:start}
}

/* ===== 搜索栏 ===== */
.searchbar{
  position:sticky;top:52px;z-index:35;
  background:rgba(247,244,238,.94);backdrop-filter:blur(8px);
  padding:12px 0 14px;border-bottom:1px solid var(--line);
}
.search-row{display:flex;gap:10px;align-items:center}
.search-box{
  flex:1;display:flex;align-items:center;gap:9px;
  background:var(--surface);border:1.5px solid var(--line-strong);border-radius:10px;
  padding:9px 13px;min-width:0;
}
.search-box:focus-within{border-color:var(--tag);box-shadow:0 0 0 3px rgba(201,55,43,.12)}
.search-box svg{flex:none;color:var(--ink-2)}
.search-box input{
  flex:1;min-width:0;border:0;outline:0;background:transparent;
  font-size:16px;font-family:var(--sans);color:var(--ink);
}
.search-box input::placeholder{color:#A8A297}
.clear-btn{
  flex:none;display:none;align-items:center;justify-content:center;
  width:26px;height:26px;border-radius:7px;border:0;cursor:pointer;
  background:var(--tag-soft);color:var(--tag);
}
.clear-btn.show{display:flex}
.kbd{
  flex:none;display:none;align-items:center;height:26px;padding:0 8px;
  border:1px solid var(--line-strong);border-radius:6px;
  font-family:var(--mono);font-size:12px;color:var(--ink-2);background:var(--surface);
}
@media(min-width:768px){.kbd{display:flex}}
.result-count{margin-top:10px;font-size:13px;color:var(--ink-2)}
.result-count b{color:var(--tag);font-family:var(--mono)}
.pills{
  display:flex;gap:8px;margin-top:12px;overflow-x:auto;padding-bottom:2px;
  scrollbar-width:thin;
}
.pill{
  flex:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);
  border-radius:999px;padding:5px 13px;font-size:13px;cursor:pointer;
  font-family:var(--sans);white-space:nowrap;transition:all .15s;
}
.pill:hover{border-color:var(--tag);color:var(--tag)}
.pill.active{background:#1F2328;border-color:#1F2328;color:#fff;font-weight:500}
.pill .n{font-family:var(--mono);font-size:12px;opacity:.7;margin-left:4px}

/* ===== 章节 ===== */
.chapters{padding:26px 0 60px}
.chapter{margin-bottom:34px;scroll-margin-top:150px}
.ch-head{
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:16px;
}
.ch-num{font-size:14px;font-weight:700;color:var(--tag);font-family:var(--mono)}
.ch-title{font-size:clamp(20px,3.4vw,27px);font-weight:900;letter-spacing:-.3px}
.ch-count{font-size:13px;color:var(--ink-2);font-family:var(--mono)}
.chapter.hide{display:none}
.ch-empty{
  display:none;padding:14px 2px;font-size:14px;color:var(--ink-2);
}
.chapter.no-match .ch-empty{display:block}

/* ===== 表格 ===== */
.tbl-wrap{overflow:hidden;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table.tags{width:100%;table-layout:fixed;border-collapse:collapse;border-spacing:0}
table.tags col:nth-child(1){width:22%}
table.tags col:nth-child(2){width:46%}
table.tags col:nth-child(3){width:32%}
table.tags th{
  text-align:left;font-size:12px;font-weight:500;color:var(--ink-2);
  padding:11px 14px;background:#F1EDE3;border-bottom:1px solid var(--line);
  font-family:var(--mono);letter-spacing:.08em;
}
table.tags td{
  padding:11px 14px;border-top:1px solid var(--line);vertical-align:middle;
  word-break:break-word;
}
table.tags tbody tr:first-child td{border-top:0}
table.tags tbody tr:hover{background:#FBF9F4}
table.tags tr.miss{display:none}
.tag-link{
  border:0;background:transparent;cursor:pointer;padding:0;
  font-family:var(--mono);font-size:15px;font-weight:700;color:var(--tag);
  display:inline-flex;align-items:center;gap:6px;text-align:left;
  max-width:100%;
}
.tag-link:hover{color:var(--ink);text-decoration:underline}
.tag-link .full{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{
  flex:none;font-family:var(--sans);font-size:11px;font-weight:700;
  border-radius:5px;padding:1px 6px;line-height:1.5;
}
.chip.dep{color:var(--amber);background:var(--amber-soft)}
.chip.new{color:var(--green);background:var(--green-soft)}
td.desc{font-size:14px;color:var(--ink)}
td.ex code{
  display:block;font-size:12.5px;color:#3D4451;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
mark{background:#FFE9A8;color:inherit;border-radius:2px;padding:0 1px}
@media(max-width:640px){
  table.tags th:nth-child(3),table.tags td:nth-child(3){display:none}
  table.tags col:nth-child(2){width:60%}
  table.tags col:nth-child(1){width:40%}
}

/* ===== 空态 ===== */
.empty-state{
  display:none;text-align:center;padding:52px 20px;background:var(--surface);
  border:1px dashed var(--line-strong);border-radius:var(--radius);margin-top:8px;
}
.empty-state.show{display:block}
.empty-state .big{font-size:30px;font-weight:900;color:#C9C2B2;font-family:var(--mono)}
.empty-state p{margin-top:10px;color:var(--ink-2);font-size:14px}

/* ===== 弹窗 ===== */
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.modal-backdrop{position:absolute;inset:0;background:rgba(20,22,25,.55);backdrop-filter:blur(3px)}
.modal-panel{
  position:relative;width:100%;max-width:760px;max-height:88vh;
  background:var(--surface);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.28);
  display:flex;flex-direction:column;overflow:hidden;
  animation:pop .18s ease-out;
}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.modal-head{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:16px 20px;border-bottom:1px solid var(--line);
}
.modal-head .m-tag{
  font-family:var(--mono);font-size:22px;font-weight:700;color:var(--tag);
}
.modal-head .badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{
  font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px;
  font-family:var(--sans);
}
.badge.single{color:var(--attr);background:#E7F0F9}
.badge.double{color:#6B5BD3;background:#EFECFB}
.badge.dep{color:var(--amber);background:var(--amber-soft)}
.badge.new{color:var(--green);background:var(--green-soft)}
.m-close{
  margin-left:auto;flex:none;width:32px;height:32px;border-radius:8px;border:0;
  background:var(--paper);color:var(--ink-2);cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.m-close:hover{background:var(--tag-soft);color:var(--tag)}
.modal-body{overflow-y:auto;padding:18px 20px 24px}
.m-sec{margin-bottom:22px}
.m-sec:last-child{margin-bottom:0}
.m-sec h4{
  font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:.06em;
  margin-bottom:9px;display:flex;align-items:center;gap:8px;
}
.m-sec h4::after{content:"";flex:1;height:1px;background:var(--line)}
.m-desc{font-size:15px;line-height:1.75}
.m-desc .rep{
  display:inline-block;font-size:12px;color:var(--ink-2);background:var(--paper);
  border:1px solid var(--line);border-radius:6px;padding:1px 8px;margin-left:4px;
}
.attr-tbl{width:100%;table-layout:fixed;border-collapse:collapse;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.attr-tbl th{
  text-align:left;font-size:12px;font-weight:500;color:var(--ink-2);background:#F1EDE3;
  padding:7px 12px;border-bottom:1px solid var(--line);
}
.attr-tbl col:nth-child(1){width:26%}
.attr-tbl col:nth-child(2){width:26%}
.attr-tbl col:nth-child(3){width:48%}
.attr-tbl td{padding:7px 12px;border-top:1px solid var(--line);font-size:13.5px;vertical-align:top;word-break:break-word}
.attr-tbl td.an{font-family:var(--mono);font-weight:500;color:var(--attr);font-size:13px}
.attr-tbl td.an.dep{color:var(--amber);text-decoration:line-through}
.attr-tbl td.av{font-family:var(--mono);color:#3D4451;font-size:12.5px}
.attr-tbl tr.miss{display:none}
.global-list{
  background:#FBF9F4;border:1px dashed var(--line-strong);border-radius:8px;
  padding:10px 14px;font-size:13px;color:var(--ink-2);
}
.global-list code{color:var(--attr);font-size:12.5px;background:#EFF3F8;border-radius:4px;padding:0 4px}
.m-example{position:relative}
.m-example pre{
  background:#1F2328;color:#E6EDF3;border-radius:10px;padding:16px 18px;
  font-size:13.5px;line-height:1.7;overflow-x:auto;
}
.m-example pre .t{color:#E0574C}.m-example pre .at{color:#7EB8E8}.m-example pre .s{color:#A3D29A}.m-example pre .c{color:#8B949E}
.copy-btn{
  position:absolute;top:10px;right:10px;
  display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.09);color:#E6EDF3;border:1px solid rgba(255,255,255,.18);
  border-radius:7px;padding:5px 11px;font-size:12.5px;cursor:pointer;font-family:var(--sans);
}
.copy-btn:hover{background:rgba(255,255,255,.16)}
.copy-btn.ok{color:#A3D29A;border-color:#A3D29A}

/* ===== 页脚 ===== */
footer{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--ink-2);font-size:13px}
footer .wrap{display:flex;flex-direction:column;gap:6px}
@media(min-width:768px){footer .wrap{flex-direction:row;justify-content:space-between}}

/* ===== 无障碍 & 动效偏好 ===== */
:focus-visible{outline:2px solid var(--tag);outline-offset:2px}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  .typer-body .cur{animation:none}
  .modal-panel{animation:none}
}
</style>
</head>
<body>

<!-- ===== 顶栏 ===== -->
<header class="topbar">
  <div class="wrap topbar-inner">
    <div class="brand"><span class="bracket">&lt;/&gt;</span>HTML5 标签手册</div>
    <div class="stat" id="topStats"></div>
  </div>
</header>

<!-- ===== Hero ===== -->
<section class="hero">
  <div class="wrap">
    <span class="hero-tag">Web 前端 · 全标签速查手册</span>
    <h1>HTML5 <em>标签手册</em></h1>
    <p class="sub">覆盖全部 HTML 标签（含已废弃标签）。点击任意标签，查看它的完整属性、全局属性与示例代码；支持按标签名、中文说明、英文关键词实时搜索。</p>
    <div class="hero-grid">
      <div class="typer" aria-hidden="true">
        <div class="typer-head"><i></i><i></i><i></i><span>标签手册.html</span></div>
        <div class="typer-body"><span class="line" id="typerLine"></span><span class="cur" id="typerCur"></span></div>
      </div>
      <div class="stats" id="heroStats"></div>
    </div>
  </div>
</section>

<!-- ===== 搜索栏 ===== -->
<div class="searchbar">
  <div class="wrap">
    <div class="search-row">
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="searchInput" type="text" placeholder="搜索标签、说明或属性…例如：img / 表单 / href" autocomplete="off" aria-label="搜索标签">
        <button class="clear-btn" id="clearBtn" aria-label="清除搜索">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
        <span class="kbd">/ 快速搜索</span>
      </div>
    </div>
    <div class="result-count" id="resultCount"></div>
    <div class="pills" id="pills"></div>
  </div>
</div>

<!-- ===== 章节 ===== -->
<main class="chapters">
  <div class="wrap" id="chapters"></div>
  <div class="wrap">
    <div class="empty-state" id="emptyState">
      <div class="big">0 结果</div>
      <p>没有找到与「<b id="emptyQuery"></b>」相关的标签，换个关键词试试，例如：img、表单、表格、链接。</p>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>HTML5 标签手册 · 基于 HTML 规范整理，属性尽量完整列出；废弃属性已标注。</span>
    <span>适用于学习与日常开发速查</span>
  </div>
</footer>

<!-- ===== 弹窗 ===== -->
<div class="modal" id="modal" aria-hidden="true">
  <div class="modal-backdrop" data-close></div>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="mTagName">
    <div class="modal-head">
      <span class="m-tag" id="mTagName"></span>
      <div class="badges" id="mBadges"></div>
      <button class="m-close" id="mClose" aria-label="关闭详情">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body" id="mBody"></div>
  </div>
</div>

<script>
/* ===== 全局属性（适用于所有标签，弹窗中展示） ===== */
const GLOBAL_ATTRS = [
  ["id","唯一标识符，页面内不可重复"],
  ["class","类名，用于 CSS / JS 选择"],
  ["style","内联样式，直接写 CSS 声明"],
  ["title","鼠标悬停提示文字"],
  ["lang","内容语言，如 zh-CN / en"],
  ["dir","文字方向：ltr（默认）/ rtl / auto"],
  ["hidden","隐藏元素（display:none 效果）"],
  ["tabindex","Tab 键顺序；-1 可聚焦但不参与顺序"],
  ["accesskey","自定义快捷键（与浏览器保留键组合使用）"],
  ["contenteditable","内容是否可编辑：true / false"],
  ["draggable","是否可拖拽：true / false / auto"],
  ["spellcheck","是否启用拼写检查"],
  ["translate","是否可被翻译工具翻译"],
  ["slot","插槽名（配合 shadow DOM 使用）"],
  ["nonce","一次性随机数（内容安全策略 CSP 使用）"],
  ["data-*","自定义数据属性，如 data-id=\"1\"，供 JS 读取"],
  ["事件属性","onclick / onchange / onfocus / onblur / onmouseover / onkeydown 等全部事件处理属性同样适用于所有标签"]
];

/* ===== 标签数据（按章节） ===== */
const DATA = [
{id:"ch1", title:"基础结构标签", tags:[

/* ===== 状态 ===== */
const state = { q:"", ch:"all" };

/* ===== 工具 ===== */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}

/* 语法高亮：转义后按 token 上色 */
function hl(code){
  let s = esc(code);
  s = s.replace(/(&lt;!--[\s\S]*?--&gt;)/g,'<span class="c">$1</span>');
  s = s.replace(/(&quot;.*?&quot;|&#39;.*?&#39;)/g,'<span class="s">$1</span>');
  s = s.replace(/([\w-]+)(?==)/g,'<span class="at">$1</span>');
  s = s.replace(/(&lt;\/?[a-zA-Z!][\w-]*)/g,'<span class="t">$1</span>');
  return s;
}
/* 搜索高亮：忽略大小写包裹 <mark> */
function mark(s,q){
  const e = esc(s);
  if(!q) return e;
  let re;
  try{ re = new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"); }
  catch(err){ return e; }
  return e.replace(re,"<mark>$1</mark>");
}
function norm(s){ return s.toLowerCase().replace(/\s+/g,"") }

/* 搜索匹配：标签名 / 中文说明 / 属性 / 关键词 / 示例 */
function tagHit(t,q){
  if(!q) return true;
  const n = norm(q);
  const pool = [
    t.t, t.d,
    ...(t.kw||[]),
    ...(t.at||[]).map(a=>a[0]+" "+(a[1]||"")),
    t.ex
  ].join(" ");
  return norm(pool).indexOf(n) !== -1;
}

/* ===== 渲染 ===== */
function chips(t,dep){
  let s = "";
  if(dep) s += '<span class="chip dep">废弃</span>';
  if(t.new) s += '<span class="chip new">HTML5</span>';
  return s;
}

function renderPills(){
  const el = document.getElementById("pills");
  let html = '<button class="pill'+(state.ch==="all"?" active":"")+'" data-ch="all">全部<span class="n">'+DATA.reduce((a,c)=>a+c.tags.length,0)+'</span></button>';
  DATA.forEach((c,i)=>{
    html += '<button class="pill'+(state.ch===c.id?" active":"")+'" data-ch="'+c.id+'">第'+toCn(i+1)+'章<span class="n">'+c.tags.length+'</span></button>';
  });
  el.innerHTML = html;
  el.querySelectorAll(".pill").forEach(b=>{
    b.addEventListener("click",()=>{
      state.ch = b.dataset.ch;
      renderPills(); renderChapters(); updateCount();
    });
  });
}

const CN = ["一","二","三","四","五","六","七","八","九","十"];
function toCn(n){ if(n<=10) return CN[n-1]; return "十"+CN[n-11]; }

function renderChapters(){
  const host = document.getElementById("chapters");
  const q = state.q;
  let total = 0, hit = 0;
  let html = "";
  DATA.forEach((c,ci)=>{
    const chId = "ch"+(ci+1);
    let rows = "";
    let chHit = 0;
    c.tags.forEach(t=>{
      total++;
      const matched = tagHit(t,q);
      if(matched) hit++, chHit++;
      const dep = !!t.dep;
      rows += '<tr class="'+(matched?"":"miss")+'" data-tag="'+t.t+'">'
        + '<td><button class="tag-link" data-open="'+t.t+'" aria-haspopup="dialog"><span class="full">&lt;'+t.t+'&gt;</span>'+chips(t,dep)+'</button></td>'
        + '<td class="desc">'+mark(t.d,q)+'</td>'
        + '<td class="ex"><code>'+esc(t.ex)+'</code></td>'
        + '</tr>';
    });
    const hide = q && chHit===0;
    html += '<section class="chapter'+(hide?" hide":"")+'" id="'+chId+'">'
      + '<div class="ch-head"><span class="ch-num">第'+toCn(ci+1)+'章</span><span class="ch-title">'+c.title+'</span><span class="ch-count">'+c.tags.length+' 个标签</span></div>'
      + '<div class="ch-empty">本组暂无匹配的标签</div>'
      + '<div class="tbl-wrap"><table class="tags"><colgroup><col><col><col></colgroup>'
      + '<thead><tr><th>标签</th><th>说明</th><th>示例</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
      + '</section>';
  });
  host.innerHTML = html;
  /* 空态 */
  const es = document.getElementById("emptyState");
  es.classList.toggle("show", total>0 && hit===0);
  if(total>0 && hit===0) document.getElementById("emptyQuery").textContent = state.q;
  /* 绑定点击 */
  host.querySelectorAll("[data-open]").forEach(b=>{
    b.addEventListener("click",()=>openModal(b.dataset.open,b));
  });
  return {total,hit};
}

function updateCount(){
  const {total,hit} = renderChapters();
  const el = document.getElementById("resultCount");
  const clear = document.getElementById("clearBtn");
  if(state.q){
    el.innerHTML = '找到 <b>'+hit+'</b> / '+total+' 个标签'+(state.ch!=="all"?"（当前分组）":"");
    clear.classList.add("show");
  }else{
    el.innerHTML = '共 <b>'+total+'</b> 个标签 · '+DATA.length+' 个章节 · 支持点击标签查看属性';
    clear.classList.remove("show");
  }
  return hit;
}

/* ===== 弹窗 ===== */
let lastFocus = null;
function findTag(name){
  for(const c of DATA){
    const t = c.tags.find(x=>x.t===name);
    if(t) return {t,c};
  }
  return null;
}
function openModal(name,trigger){
  const f = findTag(name);
  if(!f) return;
  const {t,c} = f;
  lastFocus = trigger;
  document.getElementById("modal").classList.add("open");
  document.getElementById("modal").setAttribute("aria-hidden","false");
  document.body.classList.add("lock");
  document.getElementById("mTagName").textContent = "<"+t.t+">";
  let badges = '<span class="badge '+(t.empty?"single":"double")+'">'+(t.empty?"单标签":"双标签")+'</span>';
  if(t.dep) badges += '<span class="badge dep">已废弃</span>';
  if(t.new) badges += '<span class="badge new">HTML5 新增</span>';
  badges += '<span class="badge double" style="background:var(--paper);color:var(--ink-2)">第'+c.cn+'章 · '+c.title+'</span>';
  document.getElementById("mBadges").innerHTML = badges;

  /* 主体 */
  let body = '<div class="m-sec"><h4>说明</h4><p class="m-desc">'+esc(t.d)+'</p></div>';
  /* 专属属性 */
  body += '<div class="m-sec"><h4>专属属性</h4>';
  if(t.at && t.at.length){
    body += '<table class="attr-tbl"><colgroup><col><col><col></colgroup><thead><tr><th>属性</th><th>取值</th><th>说明</th></tr></thead><tbody>';
    t.at.forEach(a=>{
      const an = a[0], av = a[2]||"", ad = a[1], adep = a[3]==="dep", anew = a[3]==="new";
      body += '<tr><td class="an'+(adep?" dep":"")+'">'+esc(an)+(adep?' <span class="chip dep">废弃</span>':(anew?' <span class="chip new">HTML5</span>':''))+'</td><td class="av">'+esc(av||"—")+'</td><td>'+esc(ad)+'</td></tr>';
    });
    body += '</tbody></table>';
  }else{
    body += '<p class="global-list" style="margin:0">无专属属性，仅支持全局属性。</p>';
  }
  body += '</div>';
  /* 全局属性 */
  body += '<div class="m-sec"><h4>全局属性（所有标签通用）</h4><div class="global-list">'+GLOBAL_ATTRS.map(g=>'<div><code>'+esc(g[0])+'</code> '+esc(g[1])+'</div>').join("")+'</div></div>';
  /* 示例 */
  body += '<div class="m-sec m-example"><h4>示例</h4><button class="copy-btn" id="copyBtn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg><span id="copyLabel">复制代码</span></button><pre>'+hl(t.ex)+'</pre></div>';
  document.getElementById("mBody").innerHTML = body;
  /* 复制 */
  const cb = document.getElementById("copyBtn");
  cb.addEventListener("click",()=>{
    const done = ()=>{
      document.getElementById("copyLabel").textContent = "已复制";
      cb.classList.add("ok");
      setTimeout(()=>{document.getElementById("copyLabel").textContent="复制代码";cb.classList.remove("ok");},1600);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t.ex).then(done).catch(()=>fallbackCopy(t.ex,done));
    }else{ fallbackCopy(t.ex,done); }
  });
  document.getElementById("mClose").focus();
}
function fallbackCopy(text,done){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); done(); }catch(e){}
  document.body.removeChild(ta);
}
function closeModal(){
  const m = document.getElementById("modal");
  if(!m.classList.contains("open")) return;
  m.classList.remove("open");
  m.setAttribute("aria-hidden","true");
  document.body.classList.remove("lock");
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}
document.getElementById("mClose").addEventListener("click",closeModal);
document.querySelectorAll("[data-close]").forEach(el=>el.addEventListener("click",closeModal));
document.addEventListener("keydown",e=>{
  if(e.key==="Escape") closeModal();
  if(e.key==="/" && document.activeElement !== document.getElementById("searchInput")){
    e.preventDefault(); document.getElementById("searchInput").focus();
  }
});

/* ===== 搜索 ===== */
const searchInput = document.getElementById("searchInput");
searchInput.addEventListener("input",()=>{
  state.q = searchInput.value.trim();
  updateCount();
});
document.getElementById("clearBtn").addEventListener("click",()=>{
  searchInput.value = ""; state.q = "";
  updateCount(); searchInput.focus();
});

/* ===== 统计 & Hero 打字动画 ===== */
function renderStats(){
  const dep = DATA.reduce((a,c)=>a+c.tags.filter(t=>t.dep).length,0);
  const tot = DATA.reduce((a,c)=>a+c.tags.length,0);
  document.getElementById("topStats").innerHTML = '<span>共 <b>'+tot+'</b> 标签</span>';
  document.getElementById("heroStats").innerHTML =
    '<div class="stat-card"><b class="red">'+tot+'</b><span>标签总数</span></div>'
    +'<div class="stat-card"><b class="blue">'+DATA.length+'</b><span>章节分类</span></div>'
    +'<div class="stat-card"><b class="amber">'+dep+'</b><span>已废弃标签</span></div>'
    +'<div class="stat-card"><b class="green">'+GLOBAL_ATTRS.length+'</b><span>通用全局属性</span></div>';
}
const HERO_SNIPPETS = [
  '<a href="url" target="_blank">文字链接</a>',
  '<img src="pic.jpg" alt="图片描述">',
  '<ul><li>选项一</li><li>选项二</li></ul>',
  '<table><tr><th>姓名</th><th>成绩</th></tr></table>',
  '<form><input type="text" name="q" placeholder="搜索"></form>'
];
function startTyper(){
  const line = document.getElementById("typerLine");
  let si = 0, ci = 0, timer = null;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce){ line.innerHTML = hl(HERO_SNIPPETS[0]); document.getElementById("typerCur").style.display="none"; return; }
  function tick(){
    const cur = HERO_SNIPPETS[si];
    ci++;
    if(ci > cur.length){
      line.innerHTML = hl(cur);
      clearInterval(timer);
      setTimeout(()=>{ si = (si+1)%HERO_SNIPPETS.length; ci = 0; timer = setInterval(tick, 55); }, 1700);
      return;
    }
    line.innerHTML = hl(cur.slice(0,ci));
  }
  timer = setInterval(tick, 55);
}

/* ===== 初始化 ===== */
DATA.forEach((c,i)=>c.cn=toCn(i+1));
renderStats();
renderPills();
updateCount();
startTyper();
